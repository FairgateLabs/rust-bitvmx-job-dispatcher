[package]
name = "bitvmx-garbled-dispatcher"
version = "0.8.2"
edition = "2021"

[dependencies]
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1.0.151"
ctrlc = "3.5.2"
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
bitvmx-broker = { git = "https://github.com/FairgateLabs/rust-bitvmx-broker.git", tag = "v0.8.2" }
hex = "0.4"
bitvmx-job-dispatcher-types = { path = "../jobtypes", features = ["garbled"] }
bitvmx-job-dispatcher = { path = "../dispatcher" }
clap = { version = "4.6.6", features = ["derive"] }

[dev-dependencies]
config = "0.15.25"
test-helper = { path = "../test-helper" }

[[example]]
name = "garbled_client"
path = "examples/garbled_client.rs"

[features]
default = []
aws = ["bitvmx-job-dispatcher/aws"]
