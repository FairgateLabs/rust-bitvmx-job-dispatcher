[package]
name = "aws-service"
version = "0.1.0"
edition = "2024"

[dependencies]
aws-config = "1.1"
aws-sdk-ec2 = "1.13"
aws-sdk-ssm = "1.13"
aws-sdk-s3 = "1.13"
tokio = { version = "1", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0.64"
serde = { version = "1.0.219", features = ["derive"] }
bitvmx-broker = { path = "../../rust-bitvmx-broker" }
ctrlc = "3.2.0"
tracing = "0.1.26"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0.95"
thiserror = "2.0.11"