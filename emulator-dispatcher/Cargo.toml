[package]
name = "bitvmx-emulator-dispatcher"
version = "0.0.2"
edition = "2021"

[dependencies]
tracing = "0.1.26"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1.0.64"
ctrlc = "3.2.0"
anyhow = "1.0.95"
serde = { version = "1.0.219", features = ["derive"] }
thiserror = "2.0.11"

bitvmx-broker = { git = "https://github.com/FairgateLabs/rust-bitvmx-broker.git", branch = "v.0.0.2" }
bitvmx-cpu-definitions = { git = "https://github.com/FairgateLabs/BitVMX-CPU.git", branch = "v.0.0.2" }
bitvmx-job-dispatcher-types = { git = "https://github.com/FairgateLabs/rust-bitvmx-job-dispatcher.git", features = [
    "emulator",
], branch = "v.0.0.2" }
#emulator = { path = "../../BitVMX-CPU/emulator" }                                                       # Remove in production?
bitvmx-job-dispatcher = { git = "https://github.com/FairgateLabs/rust-bitvmx-job-dispatcher.git", branch = "v.0.0.2" }
hex = "0.4"
clap = { version = "4.5.32", features = ["derive"] }

[dev-dependencies]
config = "0.15.11"
sled = "0.34"
