[package]
name = "bitvmx-emulator-dispatcher"
version = "0.8.1"
edition = "2021"

[dependencies]
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1.0.64"
ctrlc = "3.2.0"
anyhow = "1.0.95"
serde = { version = "1.0.219", features = ["derive"] }
thiserror = "2.0.11"

bitvmx-broker = { git = "https://github.com/FairgateLabs/rust-bitvmx-broker.git", tag = "v0.8.1" }
bitvmx-cpu-definitions = { git = "https://github.com/FairgateLabs/BitVMX-CPU.git", tag = "v0.8.1" }
bitvmx-job-dispatcher-types = { path = "../jobtypes", features = ["emulator"] }
emulator = { git = "https://github.com/FairgateLabs/BitVMX-CPU.git", tag = "v0.8.1" }
bitvmx-job-dispatcher = { path = "../dispatcher" }
hex = "0.4"
clap = { version = "4.5.32", features = ["derive"] }

[dev-dependencies]
config = "0.15.11"
sled = "0.34"
bitvmx-dispatcher-utils = { path = "../dispatcher-utils" }
test-helper = { path = "../test-helper" }
