[package]
name = "bitvmx-job-dispatcher-types"
version = "0.8.2"
edition = "2021"

[dependencies]

serde = { version = "1.0.229", features = ["derive"] }
bitvmx-cpu-definitions = { git = "https://github.com/FairgateLabs/BitVMX-CPU.git", optional = true, tag = "v0.8.3" }
emulator = { git = "https://github.com/FairgateLabs/BitVMX-CPU.git", tag = "v0.8.3" }
serde_json = "1.0.151"
thiserror = "2.0.20"
hex = "0.4"
uuid = { version = "1.0", features = ["v4"] }
bitvmx-job-dispatcher = { path = "../dispatcher" }

[features]
prover = []
emulator = ["bitvmx-cpu-definitions"]
garbled = []
