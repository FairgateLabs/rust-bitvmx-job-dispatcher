[package]
name = "bitvmx-job-dispatcher"
version = "0.8.2"
edition = "2021"

[dependencies]
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1.0.151"
ctrlc = "3.5.2"
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
hex = "0.4"
bitvmx-dispatcher-utils = { path = "../dispatcher-utils" }
bitvmx-broker = { git = "https://github.com/FairgateLabs/rust-bitvmx-broker.git", tag = "v0.8.2" }
rust-bitvmx-storage-backend = { git = "https://github.com/FairgateLabs/rust-bitvmx-storage-backend.git", tag = "v0.8.2" }
env = "1.0.1"
clap = { version = "4.6.6", features = ["derive"] }
bitvmx-aws-helper = { path = "../aws-helper", optional = true }


[dev-dependencies]
config = "0.15.25"
test-helper = { path = "../test-helper" }

[features]
default = []
aws = ["bitvmx-aws-helper"]
