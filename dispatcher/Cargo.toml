[package]
name = "bitvmx-job-dispatcher"
version = "0.0.2"
edition = "2021"

[dependencies]
tracing = "0.1.26"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1.0.64"
ctrlc = "3.2.0"
anyhow = "1.0.95"
serde = { version = "1.0.219", features = ["derive"] }
thiserror = "2.0.11"
hex = "0.4"
bitvmx-broker = { git = "https://github.com/FairgateLabs/rust-bitvmx-broker.git", branch = "v.0.0.2" }
rust-bitvmx-storage-backend = { git = "https://github.com/FairgateLabs/rust-bitvmx-storage-backend.git", branch = "v.0.0.2" }

[dev-dependencies]
config = "0.15.11"
